name: Setup Linux build dependencies
description: Install the apt packages required to build CWR/Poseidon on Linux runners.

runs:
  using: composite
  steps:
    - name: Install Linux system packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf \
          autoconf-archive \
          automake \
          autopoint \
          clang \
          gettext \
          libfontenc-dev \
          libgl1-mesa-dev \
          libice-dev \
          libltdl-dev \
          libsm-dev \
          libtool \
          libudev-dev \
          libwayland-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxaw7-dev \
          libxcb-composite0-dev \
          libxcb-cursor-dev \
          libxcb-dri2-0-dev \
          libxcb-dri3-dev \
          libxcb-ewmh-dev \
          libxcb-glx0-dev \
          libxcb-icccm4-dev \
          libxcb-image0-dev \
          libxcb-keysyms1-dev \
          libxcb-present-dev \
          libxcb-randr0-dev \
          libxcb-render-util0-dev \
          libxcb-render0-dev \
          libxcb-res0-dev \
          libxcb-shape0-dev \
          libxcb-sync-dev \
          libxcb-util-dev \
          libxcb-util0-dev \
          libxcb-xfixes0-dev \
          libxcb-xinerama0-dev \
          libxcb-xkb-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxdamage-dev \
          libxext-dev \
          libxi-dev \
          libxinerama-dev \
          libxkbcommon-dev \
          libxkbfile-dev \
          libxmu-dev \
          libxmuu-dev \
          libxpm-dev \
          libxrandr-dev \
          libxres-dev \
          libxss-dev \
          libxt-dev \
          libxtst-dev \
          libxv-dev \
          libxxf86vm-dev \
          pkg-config \
          uuid-dev \
          wayland-protocols
